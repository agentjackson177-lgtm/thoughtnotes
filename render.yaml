services:
  - type: web
    name: mindmap-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindmap-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://thoughtnotes.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

databases:
  - name: mindmap-db
    plan: free
