services:
  - type: web
    name: mindmap-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindmap-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "*"

  - type: static
    name: mindmap-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # 让前端指向 API 服务（Render 会在部署后给 mindmap-api 分配 URL；也可以在 Render 控制台手动覆盖）
      - key: VITE_API_URL
        value: ""

databases:
  - name: mindmap-db
    plan: free

